  /* FLOAT + HALO EFFECT FOR RESULT LOGO */

.result-logo {
  position: relative;

/* glowing gradient halo behind logo */
.result-logo::before {
  content: "";
  position: absolute;
  inset: -18px;

  background: radial-gradient(

    rgba(16,185,129,0.6) 0%,
    rgba(14,165,233,0.45) 40%,
    rgba(255,255,255,0.15) 65%,
    transparent 75%

  filter: blur(12px);
  animation: haloPulse 5s ease-in-out infinite;
}

/* floating motion */
@keyframes logoFloat {
  0%, 100% { transform: translateY(0px); }
  50%      { transform: translateY(-10px); }

/* gentle glow pulse */
@keyframes haloPulse {

const TEAMS = [

// currentQuestion tracks which question the user is on (0-indexed)
let currentQuestion = 0;
let scores = {};
let answers = [];

function init() {
  scores = {};
  TEAMS.forEach(t => scores[t] = 0);
  answers = [];
  currentQuestion = 0;
}

function renderQuestion() {
  const q = questions[currentQuestion];

  const prog = document.getElementById('progress');
  prog.innerHTML = '';
  for (let i = 0; i < questions.length; i++) {
    const d = document.createElement('div');
    d.className = 'progress-dot' + (i < currentQuestion ? ' done' : '');
    prog.appendChild(d);
  }

  document.getElementById('q-num').textContent = 'Question ' + (currentQuestion + 1) + ' of ' + questions.length;
  document.getElementById('q-text').textContent = q.text;

  const opts = document.getElementById('q-options');
  opts.innerHTML = '';

  const isSongs = q.type === 'songs';
  const hasImages = q.mediaKey && !isSongs;

  // Set grid class for image questions
  opts.className = 'options' + (hasImages ? ' image-grid' : '');

  q.options.forEach((o, i) => {
    const btn = document.createElement('button');
    const isSelected = answers[currentQuestion] === i;
    const team = o.team;

    if (isSongs) {
      // Spotify embed option — use named iframes so we can control them
      const trackId = team ? MEDIA.songs[team] : null;
      const hasTrack = trackId && !trackId.startsWith('PLACEHOLDER');
      btn.className = 'opt' + (hasTrack ? ' has-video' : '') + (isSelected ? ' selected' : '');
      btn.innerHTML = (hasTrack
        ? `<iframe class="opt-video" id="spotify-${i}" src="https://open.spotify.com/embed/track/${trackId}?utm_source=generator&theme=0" allowfullscreen allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>`
        : '') +
        `<span class="opt-label">${o.label}</span>` +
        (o.sub ? `<span class="opt-sub">${o.sub}</span>` : '');
    } else if (hasImages) {
      // Image grid option
      const imgSrc = MEDIA[q.mediaKey][team];
      btn.className = 'opt has-image' + (isSelected ? ' selected' : '');
      btn.innerHTML =
        `<img class="opt-img" src="${imgSrc}" alt="${o.label}" loading="lazy" onerror="this.style.display='none'">` +
        `<span class="opt-label">${o.label}</span>` +
        (o.sub ? `<span class="opt-sub">${o.sub}</span>` : '');
    } else {
      // Plain text option
      btn.className = 'opt' + (isSelected ? ' selected' : '');
      btn.innerHTML = o.label + (o.sub ? '<span class="opt-sub">' + o.sub + '</span>' : '');
    }

    btn.onclick = () => selectOption(i);
    opts.appendChild(btn);
  });

  const nextBtn = document.getElementById('btn-next');
  nextBtn.textContent = currentQuestion === questions.length - 1 ? 'See my team ✨' : 'Next →';
  nextBtn.disabled = answers[currentQuestion] === undefined;
}

function selectOption(i) {
  answers[currentQuestion] = i;
  document.querySelectorAll('.opt').forEach((el, idx) => {
    el.classList.toggle('selected', idx === i);
  });
  document.getElementById('btn-next').disabled = false;
}

function next() {
  const q = questions[currentQuestion];
  const chosen = q.options[answers[currentQuestion]];

  scores[chosen.team]++;

  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    renderQuestion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById('quiz-body').style.display = 'none';
  document.getElementById('loading').style.display = 'block';

  // Reset typewriter animation so it replays
  const loadingText = document.querySelector('.loading-text');
  const loadingSig = document.querySelector('.loading-sig');
  loadingText.style.animation = 'none';
  loadingSig.style.animation = 'none';
  loadingText.offsetHeight; // force reflow
  loadingText.style.animation = '';
  loadingSig.style.animation = '';

  // Trigger sparkle rush mode
  sparkleRush = true;

  setTimeout(function() {
    // Stop rush, fade to black, show result
    sparkleRush = false;
    document.body.classList.add('result-mode');
    document.getElementById('loading').style.display = 'none';
    document.getElementById('result').style.display = 'block';

    const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
    let winner = sorted[0][0];
    const topScore = sorted[0][1];
    const tied = sorted.filter(([team, score]) => score === topScore).map(([team]) => team);
    if (tied.length > 1) {
      // Tiebreaker: use the "player" question pick (last question)
      const playerTeam = questions[questions.length - 1].options[answers[answers.length - 1]].team;
      if (tied.includes(playerTeam)) {
        winner = playerTeam;
      }
    }

    document.getElementById('r-logo').src = LOGOS[winner];
    document.getElementById('r-logo').style.filter = 'drop-shadow(0 0 18px ' + GLOW_COLORS[winner] + ') drop-shadow(0 0 32px ' + GLOW_COLORS[winner] + ')';
    document.getElementById('r-team').textContent = winner;
    document.getElementById('r-desc').textContent = TEAM_INFO[winner].desc;

    const igUrl = TEAM_INFO[winner].instagram;
    const igWrapper = document.getElementById('ig-embed-wrapper');
    igWrapper.innerHTML = '';
    igWrapper.style.cssText = '';

    if (igUrl && igUrl.indexOf('PLACEHOLDER') === -1) {
      igWrapper.style.cssText = 'margin:20px auto 24px;max-width:400px;border-radius:10px;overflow:hidden;background:#fff;';
      igWrapper.innerHTML = '<blockquote class="instagram-media" data-instgrm-permalink="' + igUrl + '" data-instgrm-version="14" style="width:100%;margin:0;"></blockquote>';
      // Always remove and re-add embed.js to force a fresh process
      const oldScript = document.getElementById('ig-script');
      if (oldScript) oldScript.remove();
      // Small delay to let blockquote render into DOM first
      setTimeout(function() {
        if (window.instgrm) {
          window.instgrm.Embeds.process();
        } else {
          const s = document.createElement('script');
          s.id = 'ig-script';
          s.src = 'https://www.instagram.com/embed.js';
          s.async = true;
          document.body.appendChild(s);
        }
      }, 100);
    }

    document.getElementById('r-answers').innerHTML = questions.map((q, i) => {
      if (answers[i] === undefined) return '';
      const chosen = q.options[answers[i]];
      if (!chosen) return '';
      return '<div class="answer-summary"><div class="a-label">' + q.text + '</div><div class="a-value">' + chosen.label + '</div></div>';
    }).join('');

  }, 3500);
}

// ---- Sparkle animation ----
const sparkleCanvas = document.getElementById('sparkle-canvas');
const sparkleCtx = sparkleCanvas.getContext('2d');
let sparkles = [];
let sparkleRush = false;

function resizeCanvas() {
  sparkleCanvas.width = window.innerWidth;
  sparkleCanvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function randomBetween(a, b) { return a + Math.random() * (b - a); }

function createSparkle(rush) {
  return {
    x: randomBetween(0, sparkleCanvas.width),
    y: rush ? sparkleCanvas.height + 10 : randomBetween(0, sparkleCanvas.height),
    size: rush ? randomBetween(4, 10) : randomBetween(2, 6),
    opacity: randomBetween(0.4, 1),
    speedY: rush ? randomBetween(-8, -20) : randomBetween(-0.4, -1.2),
    speedX: rush ? randomBetween(-1, 1) : randomBetween(-0.3, 0.3),
    twinkleSpeed: randomBetween(0.01, 0.03),
    twinkleDir: 1,
    shape: Math.random() > 0.5 ? 'star' : 'dot'
  };
}

for (let i = 0; i < 60; i++) sparkles.push(createSparkle(false));

function drawStar(x, y, size, opacity) {
  sparkleCtx.save();
  sparkleCtx.translate(x, y);
  sparkleCtx.globalAlpha = opacity;
  sparkleCtx.fillStyle = '#fff';
  sparkleCtx.beginPath();
  for (let i = 0; i < 4; i++) {
    const angle = (i / 4) * Math.PI * 2;
    const inner = size * 0.3;
    sparkleCtx.lineTo(Math.cos(angle) * size, Math.sin(angle) * size);
    sparkleCtx.lineTo(Math.cos(angle + Math.PI / 4) * inner, Math.sin(angle + Math.PI / 4) * inner);
  }
  sparkleCtx.closePath();
  sparkleCtx.fill();
  sparkleCtx.restore();
}

function animateSparkles() {
  sparkleCtx.clearRect(0, 0, sparkleCanvas.width, sparkleCanvas.height);

  // In rush mode, flood with extra sparkles from the bottom
  if (sparkleRush && sparkles.length < 300) {
    for (let i = 0; i < 8; i++) sparkles.push(createSparkle(true));
  } else if (!sparkleRush && sparkles.length > 60) {
    sparkles = sparkles.slice(0, 60);
  }

  sparkles.forEach(s => {
    s.opacity += s.twinkleSpeed * s.twinkleDir;
    if (s.opacity >= 1 || s.opacity <= 0.1) s.twinkleDir *= -1;
    s.y += s.speedY;
    s.x += s.speedX;
    if (s.y < -10) {
      s.y = sparkleCanvas.height + 10;
      s.x = randomBetween(0, sparkleCanvas.width);
    }
    if (s.shape === 'star') {
      drawStar(s.x, s.y, s.size, s.opacity);
    } else {
      sparkleCtx.save();
      sparkleCtx.globalAlpha = s.opacity;
      sparkleCtx.fillStyle = '#fff';
      sparkleCtx.beginPath();
      sparkleCtx.arc(s.x, s.y, s.size / 2, 0, Math.PI * 2);
      sparkleCtx.fill();
      sparkleCtx.restore();
    }
  });
  requestAnimationFrame(animateSparkles);
}
animateSparkles();

function getShareText() {
  const team = document.getElementById('r-team').textContent;
  return `I just took the WPBL Personality Quiz and got ${team}! ✨`;
}

function getShareURL() {
  return window.location.href;
}

function shareTwitter() {
  const text = encodeURIComponent(getShareText());
  const url = encodeURIComponent(getShareURL());
  window.open(`https://twitter.com/intent/tweet?text=${text}&url=${url}`, '_blank');
}

function shareBluesky() {
  const text = encodeURIComponent(getShareText() + " " + getShareURL());
  window.open(`https://bsky.app/intent/compose?text=${text}`, '_blank');
}

function shareSMS() {
  const text = encodeURIComponent(getShareText() + " " + getShareURL());
  window.location.href = `sms:?&body=${text}`;
}

function copyLink() {
  const text = getShareText() + " " + getShareURL();
  navigator.clipboard.writeText(text);
  alert("Copied to clipboard!");
}
